name: CI

on:
  push:
    branches: [desktop-read, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:fast
      - run: npm run build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            test-results
            coverage
          if-no-files-found: ignore

  verify-full:
    # The native archive/read helpers require macOS arm64 and xcrun.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build:personal-archive
      - run: npm run verify:full
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-diagnostics
          path: |
            test-results
            coverage
          if-no-files-found: ignore
